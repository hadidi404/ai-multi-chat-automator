<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Updating AI Multi-Chat</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea;
    --text: #16181d; --muted: #6b7280; --accent: #4f46e5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
      --text: #e7e9ee; --muted: #939bab; --accent: #6366f1;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; height: 100vh;
    display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card { width: min(380px, 90vw); text-align: center; padding: 24px; }
  h1 { margin: 0 0 6px; font-size: 17px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }

  .bar {
    height: 6px; border-radius: 3px;
    background: var(--border); overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .pct { margin-top: 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Updating AI Multi-Chat</h1>
    <p id="detail">A newer version is required. Downloading it now&hellip;</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="pct" id="pct">Starting&hellip;</div>
  </div>

<script>
  // The main process pushes progress in through executeJavaScript, so this
  // page needs no preload and no Node access of its own.
  window.setUpdateProgress = (percent, transferred, total) => {
    const clamped = Math.max(0, Math.min(100, percent || 0));
    document.getElementById('fill').style.width = clamped + '%';

    const mb = (bytes) => (bytes / 1024 / 1024).toFixed(0);
    document.getElementById('pct').textContent = total
      ? `${clamped.toFixed(0)}% — ${mb(transferred)} of ${mb(total)} MB`
      : `${clamped.toFixed(0)}%`;
  };

  window.setUpdateDetail = (text) => {
    document.getElementById('detail').textContent = text;
  };
</script>
</body>
</html>
